<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/cadastro.css">
    <title>Cadastrar Cliente</title>
</head>
<body>
    <form id="cadastroCliente">
        <!--forms do cliente-->
        <fieldset>
            <legend>Informações pessoais do dono do pet</legend>
            <div>
                <label for="nomeDono">Nome completo: </label>
                <input type="text" id="nomeDono" name="nomeDono" placeholder="Digite o nome do cliente">
            </div>
            <div>
                <label for="cpf">CPF: </label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
            </div>
            <div>
                <label for="telefone">Telefone: </label>
                <input type="tel" id="tel" name="tel" placeholder="(11) 91234-5678">
            </div>
            <div>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" placeholder="emaildocliente@exemplo.com">
            </div>
        </fieldset>
        <!--forms do pet-->
        <fieldset>
            <legend>Informações pessoais do pet</legend>
            <div>
                <label for="nomePet">Nome completo: </label>
                <input type="text" id="nomePet" name="nomePet"placeholder="Digite o nome do pet">
            </div>
            <div>
                <label for="especie">Selecione a espécie do animal: </label>
                <select id="especie" name="especie">
                    <option value="cao">Cão</option>
                    <option value="gato">Gato</option>
                    <option value="ave">Ave</option>
                    <option value="pequenoMamifero">Pequeno Mamífero</option>
                    <option value="reptel">Réptil</option>
                    <option value="peixe">Peixe</option>
                </select>
            </div>
            <div>
                <label for="genero">Selecione o gênero do animal: </label>
                <select id="genero" name="genero">
                    <option value="fêmea">Fêmea</option>
                    <option value="macho">Macho</option>
                </select>
            </div>
            <div>
                <label for="idade">Idade: </label>
                <input id="idade" name="idade" type="text" placeholder="Digite a idade do animal">
            </div>
            <div>
                <label for="porte">Selecione o porte do animal: </label>
                <select id="porte" name="porte">
                    <option value="grande">Grande</option>
                    <option value="médio">Médio</option>
                    <option value="pequeno">Pequeno</option>
                </select>
            </div>
            <div>
                <label for="comportamento">Selecione um comportamento típico do animal: </label>
                <select id="comportamento" name="comportamento">
                    <option value="dócil">Dócil</option>
                    <option value="medroso">Medroso</option>
                    <option value="ansioso">Ansioso</option>
                    <option value="ansioso">Agressivo</option>
                    <option value="ansioso">Agitado</option>
                    <option value="ansioso">Calmo</option>
                </select>
            </div>
        </fieldset>
        <div class="button">
            <button type="submit">Finalizar Cadastro</button>
        </div>
    </form>
</body>
</html>
