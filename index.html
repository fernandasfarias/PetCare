<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/tela-login.css">
    <title>PetCare+</title>
</head>
<body>
    <header>
        <img src="assets/logo.svg" alt="logo do pet">
        <p>Faça Login para acessar os nossos clientes e pets cadastrados</p>
    </header>
    <section id="login-container">
        <form class="login-form">
            <h2>Email</h2>
            <div class="input">
                <label for="email-usuario" class="sr-only">Email</label>
                <img src="assets/email.svg" alt="ícone do email">
                <input type="email" id="email-usuario" placeholder="seu@email.com" required>
            </div>
            <h2>Senha</h2>
            <div class="input">
                <label for="senha-usuario" class="sr-only">Email</label>
                <img src="assets/senha.svg" alt="ícone do email">
                <input type="password" id="senha-usuario" placeholder="●●●●●●●●" required>
            </div>
            <p id="erro-login" style="color: red; display: none; text-align: center;"></p>
            <button type="submit">Entrar</button>
        </form>
    </section>
    <script src="scripts/auth.js"></script>
</body>
</html>
